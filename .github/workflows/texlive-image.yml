# Builds the TeX Live image that matches Overleaf (.github/texlive/Dockerfile) and publishes it as
# ghcr.io/<owner>/<repository>/texlive:overleaf-2026, for the build workflow. It only needs to run
# again when the Dockerfile changes, or by hand (Actions tab > TeX Live image > Run workflow).
# The image is large (TeX Live scheme-full without documentation) and the first build takes a while.
#
# Once published, make the package public (the repository's Packages > texlive > Package settings >
# Change visibility), so copies of this template can use it too.
name: TeX Live image

on:
  push:
    paths: ['.github/texlive/**', '.github/workflows/texlive-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write      # to publish the image

concurrency:
  group: texlive-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Make room (the runner's preinstalled SDKs are not needed)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v7
      - name: Image name (lower case, as the registry requires)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/texlive" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .github/texlive
          push: true
          tags: ${{ steps.name.outputs.image }}:overleaf-2026
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=TeX Live 2026 as on Overleaf (repository of 2026-06-24)
