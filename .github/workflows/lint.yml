# Checks the Python scripts with Ruff (settings in ruff.toml): errors and likely bugs, and one layout.
# To fix locally:  ruff check --fix  and  ruff format
name: Lint

on:
  push:
    paths: ['**.py', 'ruff.toml', '.github/workflows/lint.yml']
  pull_request:
    paths: ['**.py', 'ruff.toml', '.github/workflows/lint.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.9"   # pinned, so a new Ruff release cannot fail a push by itself
          args: check
      - name: Layout
        run: ruff format --check --diff
