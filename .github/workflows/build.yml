# Builds the thesis on every push, checks it, and keeps the PDFs.
#
#   - Two editions, both as the final version (the other options as main.tex sets them): printer.pdf
#     (PDF/X, for the printer) and digital.pdf (PDF/A-4f and PDF/UA-2, for the screen and the repository);
#     also main.tex as it is (a draft, as a rule), the propositions and the cover.
#   - The PDFs (and logs) are kept for 30 days: Actions tab > the run > Artifacts.
#   - They are checked with tools/check_pdf.py (veraPDF for a full PDF/A-4f and PDF/UA-2 validation of the
#     digital edition; tools/check_print.py for the PDF/X edition) and with tools/check_figures.py. A run
#     fails (red cross) if a PDF has something that must be fixed.
#   - The bibliography is checked with tools/check_bib.py (keys cited but missing, duplicates, missing
#     fields); the words TeX hyphenated are listed for review in the run's summary (check_hyphenation.py).
#   - Speech: tools/check_speech.py reads the digital edition the way a screen reader does (headings,
#     alternative text, table headers, the maths in words) and fails on what a listener would miss;
#     speech/spoken.txt is the whole thesis as read aloud, speech/diff.txt what reads differently since
#     the latest release. With a repository secret ANTHROPIC_API_KEY, tools/judge_speech.py also asks
#     Claude whether a blind reader could follow it: PASS or FAIL, and on FAIL speech/speech-judge.pdf
#     says why. (That sends the thesis text to Anthropic; without the secret the judge is skipped.)
#     Without the secret, tags (and runs by hand with judge: local) use an open model on the runner
#     itself instead (llama.cpp; nothing leaves GitHub's machine; slower and less strict). The model
#     is the repository variable SPEECH_JUDGE_LOCAL_MODEL; SPEECH_JUDGE_BACKEND (claude, local or
#     none) overrides the choice for every run.
#   - Push a tag (git tag draft-2026-10 && git push origin draft-2026-10), or publish a release on GitHub,
#     to attach the final PDFs to that release: thesis-digital.pdf (PDF/A-4f and PDF/UA-2),
#     thesis-print.pdf (PDF/X, with bleed), thesis-preview.pdf (the trimmed book, plain PDF), cover.pdf
#     (without the guides), propositions.pdf, veraPDF's report and spoken.txt. A fixed link to send round; in a
#     private repository only people with access to it can open it.
#
# The build uses the latest TeX Live, like Overleaf. MathTime fonts are never on GitHub, so these
# builds always use newtx for the maths.
name: Build

on:
  push:
    branches: [main, master]
    tags: ['*']
    paths-ignore:
      - '**.md'
      - .github/readme/**
  workflow_dispatch:   # run by hand: Actions tab > Build > Run workflow
    inputs:
      judge:
        description: AI judge for the speech check
        type: choice
        options: [default, local, claude, none]
        default: default

permissions:
  contents: write      # to create releases for tags

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v5
      - name: Compile the edition for the printer (final version)
        run: |
          sed -E 's/\\documentclass\[([^]]*)\]\{thesis\}/\\documentclass[\1, edition=printer, version=final]{thesis}/' main.tex > printer.tex
          latexmk -interaction=nonstopmode -halt-on-error printer.tex
      - name: Compile the digital edition (final version)
        run: |
          sed -E 's/\\documentclass\[([^]]*)\]\{thesis\}/\\documentclass[\1, edition=digital, version=final]{thesis}/' main.tex > digital.tex
          latexmk -interaction=nonstopmode -halt-on-error digital.tex
      - name: Compile the preview edition (final version)
        run: |
          sed -E 's/\\documentclass\[([^]]*)\]\{thesis\}/\\documentclass[\1, edition=preview, version=final]{thesis}/' main.tex > preview.tex
          latexmk -interaction=nonstopmode -halt-on-error preview.tex
      - name: Compile a draft (as main.tex sets it), the propositions and the cover
        run: |
          latexmk -interaction=nonstopmode -halt-on-error main.tex
          latexmk -interaction=nonstopmode -halt-on-error propositions.tex
          latexmk -interaction=nonstopmode -halt-on-error cover.tex
      - name: Compile the cover without the guides (tags only, for the release)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          sed 's/\\input{settings\/cover}/&\\coverguidesfalse/' cover.tex > cover-final.tex
          grep -q 'coverguidesfalse' cover-final.tex
          latexmk -interaction=nonstopmode -halt-on-error cover-final.tex
      - name: Keep the PDFs and the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: thesis
          path: |
            printer.pdf
            printer.log
            digital.pdf
            digital.log
            digital.bcf
            preview.pdf
            propositions.pdf
            cover.pdf
            cover-final.pdf
          retention-days: 30

  speech:
    needs: build
    runs-on: ubuntu-latest
    container: texlive/texlive:latest   # show-pdf-tags, and LuaLaTeX for the judge's report
    timeout-minutes: 240                # (a local model on a CPU is slow)
    env:
      # claude if the secret is set; else local for tags; else none. A run by hand or the variable decides.
      SPEECH_JUDGE_BACKEND: >-
        ${{ (inputs.judge != '' && inputs.judge != 'default' && inputs.judge)
            || vars.SPEECH_JUDGE_BACKEND
            || (secrets.ANTHROPIC_API_KEY != '' && 'claude')
            || (startsWith(github.ref, 'refs/tags/') && 'local')
            || 'none' }}
      SPEECH_JUDGE_LOCAL_MODEL: ${{ vars.SPEECH_JUDGE_LOCAL_MODEL || 'unsloth/Qwen3.5-4B-GGUF:Q4_K_M' }}
      LLAMA_CPP_TAG: b12721             # llama.cpp release (Dependabot does not know it: update by hand)
      LLAMA_CACHE: /__w/_llm            # downloaded models, kept between runs
    steps:
      - name: Tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends python3 python3-pikepdf nodejs npm curl ca-certificates libgomp1
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: thesis
      - name: Speech Rule Engine (MathML to words)
        run: npm ci --prefix tools/speech --no-audit --no-fund
      - name: Read the digital edition aloud and check it
        id: check
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}   # to read spoken.txt of the latest release
        run: python3 tools/check_speech.py digital.pdf --baseline-release
      - name: Local model (only for the local judge)
        if: env.SPEECH_JUDGE_BACKEND == 'local'
        uses: actions/cache@v4
        with:
          path: /__w/_llm
          key: llm-${{ env.SPEECH_JUDGE_LOCAL_MODEL }}
      - name: Start the local model
        if: env.SPEECH_JUDGE_BACKEND == 'local'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh .github/scripts/llama_server.sh
      - name: AI judge (claude with the ANTHROPIC_API_KEY secret, or local)
        id: judge
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SPEECH_JUDGE_MODEL: ${{ vars.SPEECH_JUDGE_MODEL }}
        run: python3 tools/judge_speech.py
      - name: Summary
        if: always()
        run: |
          cat speech/findings.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          if [ -f speech/judge.md ]; then echo; cat speech/judge.md; fi >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the read-aloud text and the verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: speech
          path: speech/
          retention-days: 30
      - name: Fail if a listener would miss something
        if: steps.check.outcome == 'failure' || steps.judge.outcome == 'failure'
        run: |
          echo "check_speech: ${{ steps.check.outcome }}, AI judge: ${{ steps.judge.outcome }} (see the summary and the speech artifact)"
          exit 1

  check:
    needs: [build, speech]
    if: ${{ !cancelled() && needs.build.result == 'success' }}   # (also when the speech check fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: thesis
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: speech
          path: speech
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends poppler-utils
          pip install --quiet pikepdf Pillow
          # veraPDF from its official Docker image, as a "verapdf" command for check_pdf.py
          docker pull -q verapdf/cli:latest
          mkdir -p "$HOME/bin"
          printf '#!/bin/sh\nexec docker run --rm -v "%s:%s" -w "%s" verapdf/cli:latest "$@"\n' \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" > "$HOME/bin/verapdf"
          chmod +x "$HOME/bin/verapdf"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Check the print edition (PDF/X, fonts, images, colour, log)
        run: python3 tools/check_pdf.py printer.pdf
      - name: Check the digital edition (PDF/A and PDF/UA with veraPDF, fonts, images, log)
        if: always()
        run: python3 tools/check_pdf.py digital.pdf
      - name: Check the propositions and the cover (PDF/X)
        if: always()
        run: |
          python3 tools/check_print.py propositions.pdf
          python3 tools/check_print.py cover.pdf
      - name: Check the figures
        if: always()
        run: python3 tools/check_figures.py digital.log
      - name: Check the bibliography
        if: always()
        run: python3 tools/check_bib.py --bcf digital.bcf
      - name: Hyphenated words to review (never fails)
        if: always()
        run: |
          python3 tools/check_hyphenation.py digital.log | tee hyphenation.txt || true
          { echo "<details><summary>Hyphenated words to review</summary>"; echo; echo '```'
            cat hyphenation.txt; echo '```'; echo "</details>"; } >> "$GITHUB_STEP_SUMMARY"
      - name: veraPDF report
        if: always()
        run: verapdf --format html digital.pdf > verapdf-report.html || true
      - name: Keep the veraPDF report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verapdf-report
          path: verapdf-report.html
          retention-days: 30
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # names without the tag, so that releases/latest/download/thesis-digital.pdf always works
          mkdir release
          cp digital.pdf release/thesis-digital.pdf
          cp printer.pdf release/thesis-print.pdf
          cp preview.pdf release/thesis-preview.pdf
          cp cover-final.pdf release/cover.pdf
          cp propositions.pdf release/propositions.pdf
          cp verapdf-report.html release/verapdf-report.html
          if [ -f speech/spoken.txt ]; then cp speech/spoken.txt release/spoken.txt; fi
          # a release published on GitHub already exists: then only add the files
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* --title "Thesis ${tag}" \
              --notes "Built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d). Maths in newtx (MathTime fonts are not on GitHub)."
          fi
