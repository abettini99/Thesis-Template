# Builds the thesis on every push, checks it, and keeps the PDFs.
#
#   - Two editions, both as the final version (the other options as main.tex sets them): printer.pdf
#     (PDF/X, for the printer) and digital.pdf (PDF/A-4f and PDF/UA-2, for the screen and the repository);
#     also main.tex as it is (a draft, as a rule), the propositions and the cover.
#   - The PDFs (and logs) are kept for 30 days: Actions tab > the run > Artifacts.
#   - They are checked with tools/check_pdf.py (veraPDF for a full PDF/A-4f, PDF/UA-2 and WTPDF
#     validation of the digital edition; tools/check_print.py for the PDF/X edition) and with
#     tools/check_figures.py; tools/check_ua1.py reports how a PDF/UA-1 checker such as PAC sees the
#     digital edition. A run fails (red cross) if a PDF has something that must be fixed.
#   - Push a tag (git tag draft-2026-10 && git push origin draft-2026-10), or publish a release on GitHub,
#     to attach the final PDFs to that release: thesis-digital.pdf (PDF/A-4f and PDF/UA-2),
#     thesis-print.pdf (PDF/X, with bleed), thesis-preview.pdf (the trimmed book, plain PDF), cover.pdf
#     (without the guides), propositions.pdf, veraPDF's report and the PDF/UA-1 report
#     (tools/check_ua1.py). A fixed link to send round; in a private repository only people with
#     access to it can open it.
#
# Everything is built twice: on TeX Live as Overleaf has it (what thesis authors compile with; an
# image of the TeX Live repository on the day Overleaf took its copy, .github/texlive/Dockerfile; the
# release files come from this one) and on the latest TeX Live (an early warning). When Overleaf adds
# a new TeX Live, add an image for it to both matrices and keep the older one while theses still use it.
# MathTime fonts are never on GitHub, so these builds always use newtx for the maths.
name: Build

on:
  push:
    branches: [main, master]
    tags: ['*']
    paths-ignore:
      - '**.md'
      - .github/readme/**
  workflow_dispatch:   # run by hand: Actions tab > Build > Run workflow

permissions:
  contents: write      # to create releases for tags
  packages: read       # to use the TeX Live image (.github/workflows/texlive-image.yml)

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Two TeX Live installations: Overleaf's own image (what thesis authors compile with) and the
    # latest TeX Live (early warning of what is coming). Both must pass.
    strategy:
      fail-fast: false
      matrix:
        include:
          - texlive: overleaf-2026   # .github/texlive/Dockerfile: TeX Live as on Overleaf
            image: ghcr.io/abettini99/tudelft-dissertation-template/texlive:overleaf-2026
          - texlive: latest
            image: texlive/texlive:latest
    name: build (${{ matrix.texlive }})
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      options: --user root
      credentials:   # (only for the image on GitHub's registry; none for Docker Hub)
        username: ${{ startsWith(matrix.image, 'ghcr.io') && github.actor || '' }}
        password: ${{ startsWith(matrix.image, 'ghcr.io') && secrets.GITHUB_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v5
      - name: TeX Live
        run: |
          lualatex --version | head -1
          cat /usr/local/texlive/SNAPSHOT 2>/dev/null || true
      - name: Compile the edition for the printer (final version)
        run: |
          sed -E 's/\\documentclass\[([^]]*)\]\{thesis\}/\\documentclass[\1, edition=printer, version=final]{thesis}/' main.tex > printer.tex
          latexmk -interaction=nonstopmode -halt-on-error printer.tex
      - name: Compile the digital edition (final version)
        run: |
          sed -E 's/\\documentclass\[([^]]*)\]\{thesis\}/\\documentclass[\1, edition=digital, version=final]{thesis}/' main.tex > digital.tex
          latexmk -interaction=nonstopmode -halt-on-error digital.tex
      - name: Compile the preview edition (final version)
        run: |
          sed -E 's/\\documentclass\[([^]]*)\]\{thesis\}/\\documentclass[\1, edition=preview, version=final]{thesis}/' main.tex > preview.tex
          latexmk -interaction=nonstopmode -halt-on-error preview.tex
      - name: Package versions (to compare with Overleaf's log)
        run: |
          grep -E '^(Package|Document Class|File): ' digital.log | sort -u
      - name: Compile a draft (as main.tex sets it), the propositions and the cover
        run: |
          latexmk -interaction=nonstopmode -halt-on-error main.tex
          latexmk -interaction=nonstopmode -halt-on-error propositions.tex
          latexmk -interaction=nonstopmode -halt-on-error cover.tex
      - name: Compile the cover without the guides (tags only, for the release)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          sed 's/\\input{settings\/cover}/&\\coverguidesfalse/' cover.tex > cover-final.tex
          grep -q 'coverguidesfalse' cover-final.tex
          latexmk -interaction=nonstopmode -halt-on-error cover-final.tex
      - name: Keep the PDFs and the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: thesis-${{ matrix.texlive }}
          path: |
            printer.pdf
            printer.log
            digital.pdf
            digital.log
            preview.pdf
            propositions.pdf
            cover.pdf
            cover-final.pdf
          retention-days: 30

  check:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        texlive: [overleaf-2026, latest]
    name: check (${{ matrix.texlive }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: thesis-${{ matrix.texlive }}
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends poppler-utils
          pip install --quiet pikepdf Pillow
          # veraPDF from its official Docker image, as a "verapdf" command for check_pdf.py
          docker pull -q verapdf/cli:latest
          mkdir -p "$HOME/bin"
          printf '#!/bin/sh\nexec docker run --rm -v "%s:%s" -w "%s" verapdf/cli:latest "$@"\n' \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" > "$HOME/bin/verapdf"
          chmod +x "$HOME/bin/verapdf"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Check the print edition (PDF/X, fonts, images, colour, log)
        run: python3 tools/check_pdf.py printer.pdf
      - name: Check the digital edition (PDF/A and PDF/UA with veraPDF, fonts, images, log)
        if: always()
        run: python3 tools/check_pdf.py digital.pdf
      - name: Check the propositions and the cover (PDF/X)
        if: always()
        run: |
          python3 tools/check_print.py propositions.pdf
          python3 tools/check_print.py cover.pdf
      - name: Check the figures
        if: always()
        run: python3 tools/check_figures.py digital.log
      - name: veraPDF report
        if: always()
        run: verapdf --format html digital.pdf > verapdf-report.html || true
      - name: PDF/UA-1 report (as PAC would see it; a report only)
        if: always()
        run: |
          set -o pipefail   # (fails only on findings the script cannot explain)
          python3 tools/check_ua1.py --strict digital.pdf | tee pdfua1-report.txt
      - name: Keep the veraPDF and PDF/UA-1 reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verapdf-report-${{ matrix.texlive }}
          path: |
            verapdf-report.html
            pdfua1-report.txt
          retention-days: 30
      - name: Release (tags only; the files as built on Overleaf's TeX Live)
        if: startsWith(github.ref, 'refs/tags/') && matrix.texlive == 'overleaf-2026'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # names without the tag, so that releases/latest/download/thesis-digital.pdf always works
          mkdir release
          cp digital.pdf release/thesis-digital.pdf
          cp printer.pdf release/thesis-print.pdf
          cp preview.pdf release/thesis-preview.pdf
          cp cover-final.pdf release/cover.pdf
          cp propositions.pdf release/propositions.pdf
          cp verapdf-report.html release/verapdf-report.html
          cp pdfua1-report.txt release/pdfua1-report.txt
          # a release published on GitHub already exists: then only add the files
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* --title "Thesis ${tag}" \
              --notes "Built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d). Maths in newtx (MathTime fonts are not on GitHub)."
          fi
