# Regenerates the README's images at night, but only after a day with pushes to main (commits by the
# bots do not count), and commits them if they look different: .github/readme/page-sizes.png (the
# page sizes compared) and .github/readme/cover-variants.png (the cover in four colour schemes, each
# also checked with tools/check_print.py). Run by hand, it always renders. Changes in TeX Live itself
# are watched by nightly.yml.
name: README images

on:
  schedule:
    - cron: '17 3 * * *'   # nightly, after a day with pushes; at night, so it never races a push
  workflow_dispatch:       # run by hand: Actions tab > README images > Run workflow

permissions:
  contents: write      # to commit the images

concurrency:
  group: readme-images
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - name: Tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git python3-pil python3-pikepdf poppler-utils
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the history, to see whether anything was pushed in the last day
      - name: Anything pushed in the last day?
        id: pushed
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Commit time, not author time: a rebased or late-pushed commit counts on the day it landed.
          n=$(git log --since="24 hours ago" --format='%cI %an' origin/main | grep -v 'github-actions\[bot\]' | wc -l)
          echo "Commits in the last 24 hours (not by the bots): $n"
          if [ "$n" -gt 0 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - name: Render the page sizes
        if: steps.pushed.outputs.run == 'true'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 .github/scripts/page_sizes.py
      - name: Render the cover variants
        if: steps.pushed.outputs.run == 'true'
        run: python3 .github/scripts/cover_variants.py
      - name: Commit the images if they changed
        if: steps.pushed.outputs.run == 'true'
        run: |
          git add .github/readme/page-sizes.png .github/readme/cover-variants.png
          if git diff --cached --quiet; then
            echo "Images unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update the README images"
          git pull --rebase origin main
          git push origin HEAD:main
