# Temporary: benchmark of the local AI judge (removed after the benchmark).
name: tmp bench local judge
on:
  push:
    branches: [ci-speech-quality]
    paths: ['.github/workflows/tmp-bench.yml']
permissions:
  contents: read
jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        model: ['unsloth/Qwen3.5-4B-GGUF:Q4_K_M', 'ggml-org/gemma-4-E4B-it-GGUF:Q4_K_M']
        focus: [focus, no-focus]
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    timeout-minutes: 300
    env:
      SPEECH_JUDGE_LOCAL_MODEL: ${{ matrix.model }}
      LLAMA_CPP_TAG: latest
      LLAMA_CACHE: /__w/_llm
    steps:
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 python3-pikepdf nodejs npm curl ca-certificates
      - uses: actions/checkout@v5
      - run: |
          echo "cores: $(nproc), memory: $(free -g | awk '/Mem/ {print $2}') GB"
          curl -fsSL -o digital.pdf https://github.com/abettini99/tudelft-dissertation-template/releases/download/v1.1.0/thesis-digital.pdf
          npm ci --prefix tools/speech --no-audit --no-fund
          python3 tools/check_speech.py digital.pdf --out speech > /dev/null || true
          # control: the same text with the real problems repaired (headings named, silent maths spoken)
          mkdir -p control
          python3 - <<'PY'
          import re
          t = open("speech/spoken.txt", encoding="utf-8").read()
          n = iter(range(1, 999))
          t = re.sub(r"\[heading level 1\] \(silent\)", lambda m: f"[heading level 1] Chapter {next(n)}", t)
          t = re.sub(r"\(silent; its MathML file says: ([^⟩]*)\)", r"\1", t)
          open("control/spoken.txt", "w", encoding="utf-8").write(t)
          open("control/findings.md", "w").write("**Speech check: OK**\n\n0 problem(s) to fix.\n")
          PY
      - uses: actions/cache@v4
        with:
          path: /__w/_llm
          key: llm-${{ matrix.model }}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: sh .github/scripts/llama_server.sh
      - name: Judge the template as it is
        run: python3 tools/judge_speech.py --backend local --${{ matrix.focus }} --out speech || true
      - name: Judge the repaired control
        run: python3 tools/judge_speech.py --backend local --${{ matrix.focus }} --out control || true
      - if: always()
        run: |
          mkdir -p result && cp speech/judge.json result/asis.json 2>/dev/null; cp control/judge.json result/control.json 2>/dev/null
          cp speech/llama-server.log result/ 2>/dev/null; true
          for f in result/*.json; do echo "===== $f"; cat "$f"; done
          grep -i 'n_ctx\|system_info\|AVX' result/llama-server.log | head -5 || true
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ strategy.job-index }}
          path: result/
